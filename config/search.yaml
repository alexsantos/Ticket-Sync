search:
  state: closed                 # resolved via GET /statuses on the HR instance
  dept_id: 4                    # HR department id in HR osTicket
  topic_id: 23                  # e.g. "Escalate to Ops" help topic
  # optional extra filter, only if HR uses a custom field instead of/alongside topic:
  custom_fields:
    route_to: "Ops"
  updated_after_lookback_days: 30   # bound the search window; state DB handles true idempotency
  page_size: 50
