[project]
name = "ticket-sync"
version = "0.1.0"
description = "Scheduled job that forwards closed HR osTicket tickets marked for Ops into the Ops osTicket instance"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27.0",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "apscheduler>=3.10,<4",
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "**/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
